# Villagers within this many blocks of a settlement's center belong to it.
# A villager found farther than this from every known settlement founds a new one.
settlement-radius: 96

# When a settlement is far behind (e.g. after the server was offline), simulate at most
# this many in-game days to catch up. Older days are skipped.
max-catch-up-days: 60

# Which worlds settlements are tracked and simulated in. Names match the whole world
# name, ignoring case; * matches any run of characters (e.g. "void_*").
#   allow: only these worlds are tracked. Empty means every world.
#   deny:  these worlds are never tracked, even if allowed above.
# Use this to keep out worlds with pasted structures or void generation. Settlements
# already saved in a world that is now excluded are kept but stop simulating.
worlds:
  allow: []
  deny: []

# Show residents' names when you look at them. Villagers you've renamed with a
# name tag are never overwritten.
show-names: true

# How often to save settlement data, in minutes.
autosave-minutes: 5

# Backups of settlements.json go in plugins/Hamletfolk/backups/. One is taken at every
# startup, and another every interval-hours while the server runs (0 turns those off).
# Only the newest `keep` are kept, startup and periodic together, so restarting often
# pushes the older periodic ones out; raise `keep` if that matters.
backups:
  interval-hours: 24
  keep: 5

# Residents get older. At lifespan-scale 1 they become elders at 60 in-game days (and produce
# less), and with old-age-deaths on each dies somewhere between 90 and 110 days. A Minecraft
# day is 20 real minutes, so scale 1 is only about 20 hours to an elder, which is too short for
# most servers. lifespan-scale multiplies all of those ages (and the starting ages of the first
# residents) together: 20, the default, makes an elder at 1200 days and a death at 1800 to 2200,
# roughly 17 and 25 to 30 days of real time. Sleeping through nights and /time add speed it up.
# It takes effect on restart, and applies to existing residents too (nothing is saved for it).
# old-age-deaths removes the villager from the world for good, and villages no player visits can
# empty out if nothing replaces the dead, so it is off until you have seen how yours hold up.
aging:
  lifespan-scale: 20
  old-age-deaths: false

# Every tracked villager always carries hamletfolk:gender, :occupation and :life_stage in its
# persistent data. That stays on the server (datapacks, command selectors, other plugins can
# read it); clients never see it. See docs/APPEARANCE.md.
# villager-type also sets the villager's vanilla type (plains, desert, ...) from its gender and
# life stage, and that does reach clients, so a plain resource pack that redraws those types can
# show it with no client mod. It replaces the biome look of tracked villagers (the original is
# remembered and put back if you turn this off again), so leave it off unless you ship such a pack.
appearance:
  villager-type: false

# Villager trade prices follow the settlement's stores (R3.1). A villager selling something the
# village is short of charges up to half as much again, and one buying it asks for fewer of them;
# when the village has plenty, prices fall by up to a quarter. Prices move by whole emeralds towards
# the base price, so a 1-emerald trade (bread, apples) never changes and the effect is clearest on
# trades that ask for many items (a farmer's 20 wheat). Only trades that are emeralds for food, wood,
# stone, metal or tools (or the reverse) are touched, and only for villagers that belong to a
# settlement. A player's standing with the settlement (R3.4) adds up to a tenth either way. Turn it off to leave vanilla prices alone.
prices:
  follow-supply: true

# Tools wear out as gatherers work. With tool-penalty on, a village that has a registered [Mine] but
# no tools left works at three quarters speed and the history records the shortage, until someone
# mines metal for a smith or donates tools. A village with no mine is not penalised: it has no way to
# get metal. Place a sign reading [Mine] (and [Farm], [Smithy], [Shop]) inside a village and unemployed
# residents take the jobs, unless the village is in famine. Turn this off to never slow villages.
#
# A villager sells food only while the village can spare it (R3.14): stock above what it wants to hold.
# A sale the stores cannot cover is refused. Vanilla villagers sell no wood, stone or metal, and tools,
# goods (wool, glass) and other trades (enchanted books, maps, armour) are not affected. A newly founded
# village starts with some food. Turn trades-need-stock off for vanilla stock and no starting food.
economy:
  tool-penalty: true
  trades-need-stock: true
  # R2.6: how many emeralds a village can bank before it has a treasury building. Place a sign reading
  # [Treasury] inside the village to add 500 more per sign. Rewards set aside for open requests count against
  # it (requests are paid from the treasury, so a small limit caps what a village can ask for). Income beyond
  # the limit (merchant sales, donations) is wasted, and merchants stop selling while it is full.
  treasury-base: 200
  # R4.2: an unemployed or unhappy adult may leave, at most one a day from a village, for the nearest
  # better-off village within 600 blocks that has a free bed and no famine. Both histories record it and
  # the villager is brought over the next time it is loaded. Turn off to keep everyone where they are.
  migration: true

# R1.8: a villager that stays in another village's area (outside its own village's radius, inside the
# other's) for three days is counted as a resident of that village instead, and both histories say so.
# This is how a villager you move to a new village becomes part of it. Turn off to keep every villager in
# the village it was first seen in.
membership:
  follows-residents: true

# R4.7, R4.8: villages build what they need, a block at a time, paid for from their stores, on the lots of
# their plan (see /settlement plan and /settlement lots). A builder only works while a player is within 128
# blocks, never builds over anything a player made, and never while an exempt villager is nearby.
# Turn off to stop villages building (a project in progress waits).
# R1.31: move a resident's villager that has stood walled in, in a pit open to the sky, for 10 minutes to its village's
# centre. A roofed cell (a room, a trading hall, a breeder) is never counted as a pit.
villagers:
  free-stuck: true

# R4.25: the village's work changes the land where it is loaded. Lumberjacks fell whole trees near the village (outside its
# plan) and plant saplings; miners dig a fenced quarry beside the [Mine], keeping the ore it turns up. Only trees the game
# grew and natural ground are taken. Off leaves the land as it is (the stores are the same either way).
world-marks:
  enabled: true

construction:
  enabled: true
  # R4.22: build with nobody near. Off (the default), a village only builds while a player is within 128 blocks.
  # On, the chunks a village needs are loaded just while it decides what to build (once a game day) and while a
  # project is open, then let go, and the builder works with no player in range. The server must keep running with
  # nobody online: pause-when-empty-seconds in server.properties must be -1.
  unattended: false
  # R4.22: a multiplier on how many blocks a builder places each second (1 is four a second for a new builder,
  # up to ten for a master). Raise it to test, or on a quiet server.
  speed: 1.0
  # What villagers pay, as a percentage of what the blocks would cost to craft. The game's own buildings are big (a
  # smithy is nearly 300 wood) and a village's stores hold only 100 plus 10 per resident, so at 100 most villages
  # could never afford one. Lower is cheaper.
  cost-percent: 35
