# Villagers within this many blocks of a settlement's center belong to it.
# A villager found farther than this from every known settlement founds a new one.
settlement-radius: 96

# When a settlement is far behind (e.g. after the server was offline), simulate at most
# this many in-game days to catch up. Older days are skipped.
max-catch-up-days: 60

# Which worlds settlements are tracked and simulated in. Names match the whole world
# name, ignoring case; * matches any run of characters (e.g. "void_*").
#   allow: only these worlds are tracked. Empty means every world.
#   deny:  these worlds are never tracked, even if allowed above.
# Use this to keep out worlds with pasted structures or void generation. Settlements
# already saved in a world that is now excluded are kept but stop simulating.
worlds:
  allow: []
  deny: []

# Show residents' names when you look at them. Villagers you've renamed with a
# name tag are never overwritten.
show-names: true

# How often to save settlement data, in minutes.
autosave-minutes: 5

# Backups of settlements.json go in plugins/Hamletfolk/backups/. One is taken at every
# startup, and another every interval-hours while the server runs (0 turns those off).
# Only the newest `keep` are kept, startup and periodic together, so restarting often
# pushes the older periodic ones out; raise `keep` if that matters.
backups:
  interval-hours: 24
  keep: 5

# Residents get older. At lifespan-scale 1 they become elders at 60 in-game days (and produce
# less), and with old-age-deaths on each dies somewhere between 90 and 110 days. A Minecraft
# day is 20 real minutes, so scale 1 is only about 20 hours to an elder, which is too short for
# most servers. lifespan-scale multiplies all of those ages (and the starting ages of the first
# residents) together: 20, the default, makes an elder at 1200 days and a death at 1800 to 2200,
# roughly 17 and 25 to 30 days of real time. Sleeping through nights and /time add speed it up.
# It takes effect on restart, and applies to existing residents too (nothing is saved for it).
# old-age-deaths removes the villager from the world for good, and villages no player visits can
# empty out if nothing replaces the dead, so it is off until you have seen how yours hold up.
aging:
  lifespan-scale: 20
  old-age-deaths: false

# Every tracked villager always carries hamletfolk:gender, :occupation and :life_stage in its
# persistent data. That stays on the server (datapacks, command selectors, other plugins can
# read it); clients never see it. See docs/APPEARANCE.md.
# villager-type also sets the villager's vanilla type (plains, desert, ...) from its gender and
# life stage, and that does reach clients, so a plain resource pack that redraws those types can
# show it with no client mod. It replaces the biome look of tracked villagers (the original is
# remembered and put back if you turn this off again), so leave it off unless you ship such a pack.
appearance:
  villager-type: false

# Villager trade prices follow the settlement's stores (R3.1). A villager selling something the
# village is short of charges up to half as much again, and one buying it asks for fewer of them;
# when the village has plenty, prices fall by up to a quarter. Prices move by whole emeralds towards
# the base price, so a 1-emerald trade (bread, apples) never changes and the effect is clearest on
# trades that ask for many items (a farmer's 20 wheat). Only trades that are emeralds for food, wood,
# stone, metal or tools (or the reverse) are touched, and only for villagers that belong to a
# settlement. Turn it off to leave vanilla prices alone.
prices:
  follow-supply: true

# Tools wear out as gatherers work. With tool-penalty on, a village that has a registered [Mine] but
# no tools left works at three quarters speed and the history records the shortage, until someone
# mines metal for a smith or donates tools. A village with no mine is not penalised: it has no way to
# get metal. Place a sign reading [Mine] (and [Farm], [Smithy]) inside a village and unemployed
# residents take the jobs, unless the village is in famine. Turn this off to never slow villages.
economy:
  tool-penalty: true
