<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamletfolk</title>
<style>
:root {
  --bg: #121110; --bg2: #1a1816; --panel: #201e1b; --panel2: #282521; --ink: #ece6da; --muted: #9a9284; --faint: #6d665b;
  --line: #34302a; --accent: #d7a95c; --accent2: #7fc096; --ok: #6fc28a; --watch: #e0a83a; --bad: #e06a60; --info: #6ea8e0;
  --chip: #2b2823; --shadow: 0 10px 30px rgba(0,0,0,.35); --radius: 10px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f1ea; --bg2: #ebe6db; --panel: #ffffff; --panel2: #f7f4ee; --ink: #26221c; --muted: #6e675c; --faint: #9a9284;
    --line: #ddd6c8; --accent: #a06d1e; --accent2: #2f7a4c; --ok: #2f8f55; --watch: #b8781a; --bad: #b8433a; --info: #2f6db0;
    --chip: #efeadf; --shadow: 0 10px 30px rgba(60,40,10,.12);
  }
}
:root[data-theme="light"] {
  --bg: #f4f1ea; --bg2: #ebe6db; --panel: #ffffff; --panel2: #f7f4ee; --ink: #26221c; --muted: #6e675c; --faint: #9a9284;
  --line: #ddd6c8; --accent: #a06d1e; --accent2: #2f7a4c; --ok: #2f8f55; --watch: #b8781a; --bad: #b8433a; --info: #2f6db0;
  --chip: #efeadf; --shadow: 0 10px 30px rgba(60,40,10,.12);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.linkbtn { background: none; border: 0; padding: 0 0 0 4px; color: inherit; text-decoration: underline; }
button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
button.primary { background: var(--accent); color: #1b1407; border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .5; cursor: not-allowed; }
input, select { background: var(--bg2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; }
input[type=number] { width: 68px; }
.app { display: grid; grid-template-columns: 270px minmax(0, 1fr); grid-template-rows: 54px 1fr; height: 100vh; }
.top { grid-column: 1 / -1; min-width: 0; overflow: hidden; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg2); }
.brand { font-weight: 700; letter-spacing: .02em; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.brand i { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); display: inline-block; transform: rotate(45deg); }
.top .totals { display: flex; gap: 8px; flex-wrap: wrap; }
.top .spacer { flex: 1; }
.live { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.live b { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.live.down b { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 25%, transparent); }
.side { border-right: 1px solid var(--line); background: var(--bg2); overflow: auto; padding: 10px 8px 20px; }
.side input { width: 100%; margin-bottom: 8px; }
.side h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 14px 8px 6px; }
.nav { display: grid; grid-template-columns: 12px 1fr auto; gap: 2px 8px; align-items: center; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.nav:hover { background: var(--panel); }
.nav.sel { background: var(--panel2); box-shadow: inset 2px 0 0 var(--accent); }
.nav .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav.sub-nav { margin-left: 14px; }
.nav .p { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.nav .s { grid-column: 2 / 4; height: 18px; }
.nav .s svg { width: 100%; height: 18px; display: block; }
.main { min-width: 0; overflow: auto; padding: 18px 22px 40px; }
a.button { display: inline-block; padding: 5px 11px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); text-decoration: none; background: var(--panel2); cursor: pointer; }
a.button:hover { border-color: var(--accent); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--ok); flex: none; }
.dot.h1 { background: var(--watch); } .dot.h2 { background: var(--bad); } .dot.h3 { background: var(--faint); }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; margin: 2px 4px 2px 0; }
.chip.bad { color: var(--bad); } .chip.watch { color: var(--watch); }
.k.watch, td.watch { color: var(--watch); }
h1 { font-size: 22px; margin: 0; display: flex; align-items: center; gap: 10px; }
.sub { color: var(--muted); font-size: 13px; }
.grid { display: grid; gap: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 14px 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.card .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.card .k { color: var(--muted); font-size: 12px; }
.card svg { width: 100%; height: 26px; display: block; margin-top: 4px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.panel h2 .grow { flex: 1; }
.two { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 14px; align-items: start; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 14px 0; overflow-x: auto; }
.tab { padding: 8px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); } .tab.sel { color: var(--ink); border-bottom-color: var(--accent); }
.vcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.vcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; cursor: pointer; transition: border-color .15s, transform .15s; }
.vcard:hover { border-color: var(--accent); transform: translateY(-1px); }
.vcard .t { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; }
.vcard .t .pop { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 13px; }
.bars { display: grid; grid-template-columns: 46px 1fr 38px; gap: 3px 8px; align-items: center; margin: 8px 0; font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: var(--bg2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent2); border-radius: 4px; }
.bar i.low { background: var(--bad); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); position: sticky; top: 0; background: var(--panel); }
tr:last-child td { border-bottom: 0; }
.low { color: var(--bad); font-weight: 600; }
.meter { width: 56px; height: 6px; background: var(--bg2); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
.meter i { display: block; height: 100%; background: var(--accent2); } .meter i.low { background: var(--bad); }
.scroll { max-height: 560px; overflow: auto; }
.feed { display: flex; flex-direction: column; max-height: 680px; overflow: auto; }
.ev { display: grid; grid-template-columns: 6px 1fr; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--line); }
.ev:last-child { border-bottom: 0; }
.ev .k { border-radius: 4px; background: var(--faint); }
.ev .k.good { background: var(--ok); } .ev .k.bad { background: var(--bad); } .ev .k.build { background: var(--info); } .ev .k.watch { background: var(--watch); }
.ev .m { font-size: 12px; color: var(--muted); }
.ev .m a { color: var(--accent); cursor: pointer; }
.ev.new { animation: flash 2.5s ease-out; }
.ev.earlier { opacity: .6; }
@keyframes flash { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } to { background: transparent; } }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 6px 0; border-bottom: 1px solid var(--line); }
ul.plain li:last-child { border-bottom: 0; }
.tier { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-right: 6px; }
.empty { color: var(--muted); font-style: italic; }
.mapwrap { position: relative; }
canvas.map { width: 100%; height: 560px; display: block; border-radius: 8px; background: var(--bg2); cursor: grab; touch-action: none; }
canvas.map.drag { cursor: grabbing; }
.tip { position: absolute; pointer-events: none; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px;
  box-shadow: var(--shadow); display: none; max-width: 260px; z-index: 5; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.act { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.act .d { color: var(--muted); font-size: 12px; flex: 1; }
.act .row { display: flex; gap: 6px; align-items: center; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 20; }
.modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; width: min(440px, 92vw); box-shadow: var(--shadow); }
.modal .box p { margin: 0 0 14px; }
.modal .box .row { display: flex; gap: 8px; justify-content: flex-end; }
#toast { position: fixed; right: 18px; bottom: 18px; max-width: 440px; padding: 10px 14px; border-radius: 10px; background: var(--panel2);
  border: 1px solid var(--line); box-shadow: var(--shadow); display: none; z-index: 30; }
#toast.ok { border-left: 4px solid var(--ok); } #toast.bad { border-left: 4px solid var(--bad); }
.menu-btn { display: none; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .cards { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  .side { display: none; position: fixed; top: 54px; bottom: 0; left: 0; width: 280px; z-index: 10; box-shadow: var(--shadow); }
  .side.open { display: block; }
  .menu-btn { display: inline-block; }
  .two { grid-template-columns: 1fr; }
  .top .totals { display: none; }
  .main { padding: 14px 14px 40px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="menu-btn" id="menu" type="button" aria-label="villages">&#9776;</button>
    <div class="brand"><i></i>Hamletfolk</div>
    <div class="totals" id="totals"></div>
    <div class="spacer"></div>
    <div class="live" id="live"><b></b><span>connecting</span></div>
    <button id="theme" type="button" aria-label="switch theme">&#9680;</button>
  </header>
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>
<div class="modal" id="modal"><div class="box"><p id="modal-text"></p><div class="row"><button id="modal-no" type="button">Cancel</button><button id="modal-yes" class="primary" type="button">Go ahead</button></div></div></div>
<div id="toast" role="status"></div>
<script>
"use strict";
// ----- what the server writes in -----
const TOKEN = "__HAMLETFOLK_TOKEN__";
const ACTIONS = __HAMLETFOLK_ACTIONS__;

// ----- state -----
/** R1.50: copy a command to the clipboard (the page is on the loopback address, which counts as secure). */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied: " + text, true); }
  catch (e) {
    const box = document.createElement("textarea"); box.value = text; document.body.append(box); box.select();
    try { document.execCommand("copy"); toast("Copied: " + text, true); } catch (e2) { toast("Could not copy: " + text, false); }
    box.remove();
  }
}
/** The /tp for a place in a village: the height of the nearest building (a villager's door is at ground level), else 100. */
function tpCommand(v, x, z, y) {
  if (y === undefined || y === null) {
    let best = null, bd = Infinity;
    for (const b of v.buildings || []) { const d = Math.hypot(b.x - x, b.z - z); if (d < bd) { bd = d; best = b; } }
    y = best ? best.y + 1 : 100;
  }
  return "/tp @s " + Math.round(x) + " " + y + " " + Math.round(z);
}
const tpButton = (v, x, z, y, label) => el("button", { title: "copy a /tp to this place (in " + v.world + ")", onclick: () => copyText(tpCommand(v, x, z, y)) }, label || "Copy /tp");
/** R1.51: what an upgrade costs and what the stores lack of it, in words. */
function costText(bi) {
  if (!bi || !bi.cost || !Object.keys(bi.cost).length) return "";
  const list = (o) => Object.entries(o).map(([k, n]) => n + " " + k).join(", ");
  return "Costs " + list(bi.cost) + (Object.keys(bi.lacking || {}).length ? " · the stores are short of " + list(bi.lacking) : " · the stores can pay");
}
/** R8.30: a house's beds in words: the beds the game knows of there and how many a villager has claimed (the design's count if none is known yet). */
function bedsText(bi) {
  if (!bi) return "";
  if (bi.liveBeds !== undefined && (bi.liveBeds > 0 || !bi.beds)) return bi.liveBeds + (bi.liveBeds === 1 ? " bed" : " beds") + ", " + bi.claimedBeds + " claimed";
  return bi.beds ? bi.beds + (bi.beds === 1 ? " bed (design)" : " beds (design)") : "";
}
// R8.27: which layers of the plan map are on (kept in this browser only)
function loadLayers() {
  const base = { slope: false, districts: false, homes: false, defence: false, beds: false };
  let out = base;
  try { out = Object.assign(base, JSON.parse(localStorage.getItem("hamletfolk-layers") || "{}")); } catch (e) { /* not kept */ }
  const asked = new URLSearchParams(location.search).get("layers"); // ?layers=slope,homes turns them on from a link
  if (asked) asked.split(",").forEach((k) => { if (k in out) out[k] = true; });
  return out;
}
const LAYERS = [["slope", "Slope"], ["districts", "Districts"], ["homes", "Homes"], ["defence", "Defence and lights"], ["beds", "Beds"]];
const SLOPE = { "0": "#6fae62", "1": "#cdbf53", "2": "#dd8a3f", "3": "#cf4d3f", "~": "#4c86c6" };
const familyColour = (name) => { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360; return "hsl(" + h + ",65%,55%)"; };
const state = {
  worlds: [], worldsText: "", villages: [], villagesText: "", detail: null, detailText: "", trends: {}, events: [], latest: 0, catalogue: null,
  attention: [], attentionText: "", layers: loadLayers(), defence: null, defenceText: "", current: null, tab: "overview", filter: "", feedFilter: "all", seenFeed: 0, map: null, busy: false, sel: null,
};
const $ = (id) => document.getElementById(id);
const main = $("main");

// ----- helpers -----
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k.startsWith("on")) e[k] = v; else e.setAttribute(k, v === true ? "" : v);
  }
  return fill(e, kids, true);
}
/** Puts children in a node (arrays flattened, null and false skipped); replaces what was there unless {@code keep}. */
function fill(e, kids, keep) {
  if (!keep) e.replaceChildren();
  for (const kid of [kids].flat(Infinity)) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
function svg(tag, attrs, ...kids) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  for (const kid of kids) e.append(kid);
  return e;
}
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const fmt = (n) => n == null ? "-" : Number(n) >= 10000 ? (n / 1000).toFixed(1) + "k" : String(n);
const ago = (ms) => { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 60 ? s + "s ago" : s < 3600 ? Math.round(s / 60) + "m ago" : Math.round(s / 3600) + "h ago"; };
async function get(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.text(); }
function toast(text, ok) {
  const t = $("toast"); t.textContent = text; t.className = ok ? "ok" : "bad"; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.style.display = "none"; }, 7000);
}
function ask(text) {
  return new Promise((done) => {
    $("modal-text").textContent = text; $("modal").style.display = "flex";
    const close = (v) => { $("modal").style.display = "none"; $("modal-yes").onclick = $("modal-no").onclick = null; done(v); };
    $("modal-yes").onclick = () => close(true); $("modal-no").onclick = () => close(false);
    $("modal-yes").focus();
  });
}

/** A small line graph of one column of a village's samples (0 people, 1 food, 2 wood, 3 stone, 4 tools, 5 treasury, 6 beds). */
function spark(id, column, colour) {
  const points = (state.trends[id] || []).map((p) => p[column]);
  const box = svg("svg", { viewBox: "0 0 100 24", preserveAspectRatio: "none" });
  if (points.length < 2) return box;
  const lo = Math.min(...points), hi = Math.max(...points), span = hi - lo || 1;
  const d = points.map((v, i) => (i ? "L" : "M") + (i * 100 / (points.length - 1)).toFixed(1) + "," + (22 - (v - lo) * 20 / span).toFixed(1)).join(" ");
  box.append(svg("path", { d, fill: "none", stroke: colour || "var(--accent)", "stroke-width": "1.6", "vector-effect": "non-scaling-stroke" }));
  return box;
}

// what a kind of history line means, for its colour and the "important" filter
const KIND = { birth: "good", arrival: "good", recovery: "good", cure: "good", founded: "good", donation: "good", death: "bad", famine: "bad", raid: "bad", abandoned: "bad",
  departure: "watch", shortage: "watch", building: "build" };
const IMPORTANT = new Set(["birth", "arrival", "death", "famine", "recovery", "raid", "shortage", "abandoned", "departure", "cure", "founded"]);

// ----- actions (R1.36): the server checks everything again -----
async function act(body, question) {
  const info = state.catalogue && state.catalogue.actions.find((a) => a.action === body.action);
  if ((info && info.confirm) || question) {
    if (!await ask((question || info.label) + "? This is written to the audit log.")) return;
    body.confirm = true;
  }
  state.busy = true;
  main.querySelectorAll("button, select, input").forEach((b) => { b.disabled = true; });
  try {
    const r = await fetch("/api/action", { method: "POST", headers: { "Content-Type": "application/json", "X-Hamletfolk-Token": TOKEN },
      body: JSON.stringify(body), cache: "no-store" });
    const out = await r.json().catch(() => ({ ok: false, message: "No answer (" + r.status + ")" }));
    toast(out.message, out.ok);
  } catch (e) {
    toast("Could not reach the server: " + e.message, false);
  } finally {
    state.busy = false;
    state.villagesText = state.detailText = "";
    await poll(true);
  }
}

// ----- polling: the feed every time, the rest only redrawn when it changed -----
let ticks = 0;
async function poll(force) {
  if (state.busy && !force) return;
  try {
    if (ACTIONS && !state.catalogue) state.catalogue = JSON.parse(await get("/api/actions"));
    let feed = JSON.parse(await get("/api/events?since=" + state.latest));
    if (state.start && feed.start !== state.start) { // the server restarted: its numbers began again
      state.events = []; state.latest = 0; state.seenFeed = 0;
      feed = JSON.parse(await get("/api/events?since=0"));
    }
    state.start = feed.start;
    if (feed.events.length) { state.events = state.events.concat(feed.events).slice(-400); state.latest = feed.latest; }
    if (force || ticks % 20 === 0) state.trends = JSON.parse(await get("/api/trends"));
    const villagesText = await get("/api/villages");
    let changed = villagesText !== state.villagesText;
    if (changed) { state.villagesText = villagesText; state.villages = JSON.parse(villagesText); }
    const attentionText = await get("/api/attention");
    if (attentionText !== state.attentionText) { state.attentionText = attentionText; state.attention = JSON.parse(attentionText); changed = true; }
    const worldsText = await get("/api/worlds");
    if (worldsText !== state.worldsText) { state.worldsText = worldsText; state.worlds = JSON.parse(worldsText); changed = true; }
    if (state.current && !isWorld(state.current) && !isPage(state.current)) {
      const t = await get("/api/village/" + encodeURIComponent(state.current)).catch(() => null);
      if (t && t !== state.detailText) { state.detailText = t; state.detail = JSON.parse(t); changed = true; }
    }
    if (state.current && !isWorld(state.current) && !isPage(state.current) && state.tab === "plan" && state.layers.defence) { // R8.28: asked for only while it is looked at
      const d = await get("/api/defence/" + encodeURIComponent(state.current)).catch(() => null);
      if (d && d !== state.defenceText) { state.defenceText = d; state.defence = JSON.parse(d); changed = true; }
    }
    setLive(true);

    el("div", { class: "sub" }, lot.rect[2] + " by " + lot.rect[3] + " at " + lot.rect[0] + ", " + lot.rect[1]));
  if (!ACTIONS || !state.catalogue || lot.status === "filled") {
    return el("div", { class: "panel" }, el("h2", null, "Selected lot"), head, lot.status === "filled" ? el("div", { class: "sub" }, "A building stands here: it is not changed from here.") : null);
  }
  const kinds = state.catalogue.buildings.filter((b) => b.lot);
  const pick = el("select", { "aria-label": "kind of building for this lot" }, kinds.map((b) => el("option", { value: b.type, selected: b.label === lot.type }, b.label)));
  return el("div", { class: "panel" }, el("h2", null, "Selected lot"), head, el("div", { style: "margin-top:6px" }, tpButton(v, lot.rect[0] + lot.rect[2] / 2, lot.rect[1] + lot.rect[3] / 2, undefined, "Copy /tp here")),
    el("div", { class: "row", style: "margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center" },

      el("span", { class: "sub" }, "or set it aside for"), pick,

    el("div", { class: "sub", style: "margin-top:6px" }, "A lot keeps its size: a building only goes on it if its design fits. Nothing that stands is moved."));
}

/** R8.23: what the village may not build, and what it has been told to build next. */
function rules(v) {
  if (!ACTIONS || !state.catalogue) return null;

  const pickNext = el("select", { "aria-label": "building to build next" }, kinds.filter((b) => b.next).map((b) => el("option", { value: b.type }, b.label)));
  const pickNo = el("select", { "aria-label": "building to forbid" }, kinds.map((b) => el("option", { value: b.type }, b.label)));
  return el("div", { class: "panel" }, el("h2", null, "Building rules"),
    el("div", null, el("b", null, "Build next: "), next ? [el("span", { class: "chip" }, label(next)), el("button", { onclick: () => act({ action: "clear-build-next", village: v.id, building: next }) }, "Withdraw")]
      : [el("span", { class: "sub" }, "nothing ordered. "), pickNext, el("button", { onclick: () => act({ action: "build-next", village: v.id, building: pickNext.value }) }, "Build this next")]),
    el("div", { class: "sub" }, "Goes ahead of everything else the village wants (not ahead of a famine), if it has the people, a lot and the materials. Stands 40 days."),
    el("div", { style: "margin-top:12px" }, el("b", null, "Not allowed: "), forbidden.length ? forbidden.map((t) => el("span", { class: "chip bad" }, label(t) + " ",
        el("button", { class: "linkbtn", onclick: () => act({ action: "allow", village: v.id, building: t }) }, "allow"))) : el("span", { class: "sub" }, "nothing forbidden. "),
      pickNo, el("button", { onclick: () => act({ action: "forbid", village: v.id, building: pickNo.value }) }, "Forbid")),
    el("div", { class: "sub" }, "The village stops asking for it and building it. What already stands is left alone."));
}

function drawMap(canvas, tip, v) {
  const p = v.plan, dpr = window.devicePixelRatio || 1, W = canvas.clientWidth, H = canvas.clientHeight;
  for (const b of v.buildings) { // whether a lot of the plan stands round it (a margin of two, as a sign is often at a building's edge)
    b.noLot = !p.lots.some((l) => b.x >= l.rect[0] - 2 && b.x < l.rect[0] + l.rect[2] + 2 && b.z >= l.rect[1] - 2 && b.z < l.rect[1] + l.rect[3] + 2);
  }
  if (!W || !H) return;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const g = canvas.getContext("2d"); g.scale(dpr, dpr);
  if (!state.map || state.map.id !== v.id) {
    const rects = [...p.roads.map((r) => r.rect), ...p.lots.map((l) => l.rect), ...(p.square ? [p.square] : [])];
    let x0 = Infinity, z0 = Infinity, x1 = -Infinity, z1 = -Infinity;
    for (const [x, z, w, d] of rects) { x0 = Math.min(x0, x); z0 = Math.min(z0, z); x1 = Math.max(x1, x + w); z1 = Math.max(z1, z + d); }
    for (const b of v.buildings) { x0 = Math.min(x0, b.x); z0 = Math.min(z0, b.z); x1 = Math.max(x1, b.x + 1); z1 = Math.max(z1, b.z + 1); }
    const s = Math.min((W - 40) / (x1 - x0 || 1), (H - 40) / (z1 - z0 || 1));
    state.map = { id: v.id, s, ox: W / 2 - (x0 + x1) / 2 * s, oz: H / 2 - (z0 + z1) / 2 * s, dragging: false };
  }
  const m = state.map, css = getComputedStyle(document.documentElement), col = (n) => css.getPropertyValue(n).trim();
  const X = (x) => m.ox + x * m.s, Z = (z) => m.oz + z * m.s;
  function paint(hover) {
    g.fillStyle = col("--bg2"); g.fillRect(0, 0, W, H);
    if (state.layers.slope && v.ground) { // R8.27: the lie of the land, under everything else
      const gr = v.ground, cs = gr.step * m.s;
      g.globalAlpha = .6;
      gr.slope.forEach((row, r) => { for (let c = 0; c < row.length; c++) { const colr = SLOPE[row[c]]; if (colr) { g.fillStyle = colr; g.fillRect(X(gr.x + c * gr.step), Z(gr.z + r * gr.step), cs + .5, cs + .5); } } });
      g.globalAlpha = 1;
    }
    g.fillStyle = "#8a6d48";
    for (const r of p.roads) { const [x, z, w, d] = r.rect; g.fillRect(X(x), Z(z), w * m.s, d * m.s); }
    if (p.square) { const [x, z, w, d] = p.square; g.fillStyle = "#b9b1a0"; g.fillRect(X(x), Z(z), w * m.s, d * m.s); }
    for (const l of p.lots) {
      const [x, z, w, d] = l.rect, c = lotColour(l.type);
      const picked = state.sel === v.id + ":" + l.id;
      g.lineWidth = hover === l || picked ? 3 : 1.5; g.strokeStyle = picked ? col("--accent") : c; g.fillStyle = c;
      if (l.status === "filled") { g.globalAlpha = .55; g.fillRect(X(x), Z(z), w * m.s, d * m.s); g.globalAlpha = 1; if (hover === l) g.strokeRect(X(x), Z(z), w * m.s, d * m.s); }
      else { g.setLineDash(l.status === "rough" ? [5, 4] : []); g.strokeRect(X(x) + .5, Z(z) + .5, w * m.s - 1, d * m.s - 1); g.setLineDash([]); }
      if (picked && l.status === "filled") { g.strokeStyle = col("--accent"); g.strokeRect(X(x), Z(z), w * m.s, d * m.s); }
      if (l.locked) { // kept empty by an admin: crossed out
        g.strokeStyle = col("--bad"); g.lineWidth = 1.5; g.beginPath();
        g.moveTo(X(x), Z(z)); g.lineTo(X(x + w), Z(z + d)); g.moveTo(X(x + w), Z(z)); g.lineTo(X(x), Z(z + d)); g.stroke();
      }
    }
    if (state.layers.districts) { // R8.27: the old town, the new quarter...
      g.font = "600 12px system-ui, sans-serif"; g.textBaseline = "top";
      (p.districts || []).forEach((d, i) => {
        const [x, z, w, dd] = d.rect, c = ["#e8c26a", "#6ac0e8", "#c98ae8", "#8ae8a0"][i % 4];
        g.setLineDash([8, 5]); g.lineWidth = 2; g.strokeStyle = c; g.strokeRect(X(x) + 1, Z(z) + 1, w * m.s - 2, dd * m.s - 2); g.setLineDash([]);
        g.fillStyle = c; g.fillText(d.name + " (" + d.built + " of " + d.lots + " lots)", X(x) + 6, Z(z) + 4);
      });
    }
    const def = state.layers.defence && state.defence && state.defence.id === v.id && state.defence.lights ? state.defence : null;
    if (def) { // R8.28: the wall, the lights and the guards' round
      const tierColour = def.tier >= 3 ? "#aab0b8" : def.tier === 2 ? "#b98b57" : "#c8a86a", sz = Math.max(2, m.s);
      def.wall.forEach(([x, z], i) => {
        const c = (def.wallBuilt || "")[i];
        g.fillStyle = c === "1" ? tierColour : c === "?" ? "#7a7a7a" : def.tier ? "#d5493d" : "rgba(200,168,106,.45)";
        g.fillRect(X(x) - sz / 2 + m.s / 2, Z(z) - sz / 2 + m.s / 2, sz, sz);
      });
      if (def.patrol.length > 1) {
        g.beginPath(); def.patrol.forEach(([x, z], i) => { if (i) g.lineTo(X(x + .5), Z(z + .5)); else g.moveTo(X(x + .5), Z(z + .5)); }); g.closePath();
        g.setLineDash([6, 5]); g.lineWidth = 1.5; g.strokeStyle = "#5fa8ff"; g.stroke(); g.setLineDash([]);
        g.fillStyle = "#5fa8ff"; def.patrol.forEach(([x, z]) => { g.beginPath(); g.arc(X(x + .5), Z(z + .5), 2.5, 0, 7); g.fill(); });
      }
      def.lights.forEach(([x, z], i) => {
        const c = (def.lightsBuilt || "")[i];
        g.beginPath(); g.arc(X(x + .5), Z(z + .5), Math.max(2.5, m.s * .7), 0, 7);
        g.fillStyle = c === "1" ? "#f2c744" : "#6b6b6b"; g.globalAlpha = c === "?" ? .4 : 1; g.fill(); g.globalAlpha = 1;
        if (c === "1") { g.strokeStyle = "rgba(242,199,68,.4)"; g.lineWidth = 3; g.stroke(); }
      });
    }
    if (state.layers.beds && v.bedsLive) { // R8.30: the beds the game knows of, claimed or free
      for (const [x, z, claimed] of v.bedsLive.places) {
        g.beginPath(); g.arc(X(x + .5), Z(z + .5), Math.max(3, m.s * .8), 0, 7);
        if (claimed) { g.fillStyle = "#f2a33a"; g.fill(); } else { g.lineWidth = 2; g.strokeStyle = "#f2a33a"; g.stroke(); }

    }
    if (state.layers.homes) { // R8.27: whose house is whose
      for (const h of v.homes || []) {
        const hx = X(h.x + .5), hz = Z(h.z + .5);
        g.beginPath(); g.arc(hx, hz, 9, 0, 7); g.lineWidth = 3; g.strokeStyle = h.empty ? "#8a8a8a" : familyColour(h.family); g.setLineDash(h.empty ? [3, 3] : []); g.stroke(); g.setLineDash([]);
      }
    }
    for (const b of v.buildings) {
      const bx = X(b.x + .5), bz = Z(b.z + .5), r = hover === b ? 6 : 4;
      if (b.noLot) { // no lot of the plan here: a dashed ring, so it reads as a building the plan does not account for
        g.beginPath(); g.arc(bx, bz, r + 4, 0, 7); g.setLineDash([3, 3]); g.lineWidth = 1.5; g.strokeStyle = col("--accent"); g.stroke(); g.setLineDash([]);
      }
      g.beginPath(); g.arc(bx, bz, r, 0, 7);
      g.fillStyle = lotColour(b.type); g.fill();
      g.lineWidth = 1.5; g.strokeStyle = b.by === "found" ? col("--muted") : col("--ink"); g.stroke();
    }
  }
  function at(ex, ey) {
    const wx = (ex - m.ox) / m.s, wz = (ey - m.oz) / m.s;
    let best = null, bd = 6 / m.s;
    for (const b of v.buildings) { const d = Math.hypot(b.x + .5 - wx, b.z + .5 - wz); if (d < bd) { bd = d; best = b; } }
    if (best) return best;
    for (const l of p.lots) { const [x, z, w, d] = l.rect; if (wx >= x && wx < x + w && wz >= z && wz < z + d) return l; }
    return null;
  }
  paint(null);
  let last = null;
  const pos = (e) => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  canvas.onpointermove = (e) => {
    const [ex, ey] = pos(e);
    if (m.dragging) { m.moved += Math.abs(ex - m.lx) + Math.abs(ey - m.ly); m.ox += ex - m.lx; m.oz += ey - m.ly; m.lx = ex; m.ly = ey; paint(null); tip.style.display = "none"; return; }
    const hit = at(ex, ey);
    if (hit !== last) { last = hit; paint(hit); }
    if (!hit) { tip.style.display = "none"; return; }
    fill(tip, (hit.rect
      ? [el("b", null, hit.type + " lot " + hit.id), el("div", null, (hit.locked ? "Kept empty by an admin. " : "") + (hit.status === "reserved" ? "Ready to build on" : hit.status === "rough" ? "Rough ground (levelled when built on)" : "Built on")),
         el("div", { class: "sub" }, hit.rect[2] + " by " + hit.rect[3] + " at " + hit.rect[0] + ", " + hit.rect[1])]
      : [el("b", null, (hit.name ? hit.name + " \u00b7 " : "") + hit.type + (hit.tier > 1 ? " tier " + hit.tier : "")), el("div", { class: "sub" }, "at " + hit.x + ", " + hit.y + ", " + hit.z), el("div", { class: "sub" }, hit.by === "found" ? "found standing (a vanilla building)" : "registered by " + hit.by),

         (() => { const bi = (v.buildingInfo || {})[hit.x + "," + hit.y + "," + hit.z]; return bi ? el("div", null, "Tier " + bi.tier + " of " + bi.maxTier + (bedsText(bi) ? " · " + bedsText(bi) + (bi.nextBeds ? " (" + bi.nextBeds + " at tier " + (bi.tier + 1) + ")" : "") : "")) : null; })(),
         (() => { const home = (v.homes || []).find((h) => h.x === hit.x && h.z === hit.z); return home ? el("div", null, home.empty ? "Nobody lives here." : "The " + home.family + " household: " + home.people.join(", ")) : null; })()]));

  };

    m.dragging = false; canvas.classList.remove("drag");
    if (!click) return;
    const [ex, ey] = pos(e), hit = at(ex, ey);
    const lotHit = hit && hit.rect ? hit : (hit ? p.lots.find((l) => { const [x, z, w, d] = l.rect; return hit.x >= x && hit.x < x + w && hit.z >= z && hit.z < z + d; }) : null);
    state.sel = lotHit ? v.id + ":" + lotHit.id : null;
    state.selB = hit && !hit.rect ? v.id + ":" + hit.x + "," + hit.y + "," + hit.z : null; // R8.29: a building clicked on the map
    renderMain();
  };

    e.preventDefault();
    const [ex, ey] = pos(e), k = e.deltaY < 0 ? 1.2 : 1 / 1.2, ns = Math.max(.5, Math.min(40, m.s * k)), f = ns / m.s;
    m.ox = ex - (ex - m.ox) * f; m.oz = ey - (ey - m.oz) * f; m.s = ns; paint(last);
  };
}

// ----- moving about -----
function go(id) {
  if (state.current !== id) { state.tab = "overview"; state.detail = null; state.detailText = ""; }
  state.current = id;
  if (fromHash()[0] !== id) location.hash = id || "";
  $("side").classList.remove("open");
  main.scrollTop = 0;
  poll(true);
}
// the address holds the village and tab (#id/plan), so a view can be bookmarked or shared with another admin
function fromHash() {
  const [id, tab] = location.hash.slice(1).split("/");
  let name = id || null;
  try { if (name) name = decodeURIComponent(name); } catch (e) { /* leave it */ }
  return [name, tab || null];
}
window.addEventListener("hashchange", () => {
  const [id, tab] = fromHash();
  if (id !== state.current) { go(id); if (tab) state.tab = tab; } else if ((tab || "overview") !== state.tab) { state.tab = tab || "overview"; renderMain(); }
});
$("menu").onclick = () => $("side").classList.toggle("open");
$("theme").onclick = () => {
  const root = document.documentElement, dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#121110";
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("hamletfolk-theme", dark ? "light" : "dark"); } catch (e) { /* not kept */ }
  renderMain();
};
try { const t = localStorage.getItem("hamletfolk-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) { /* default */ }
window.addEventListener("resize", () => { if (state.tab === "plan") renderMain(); });
[state.current, state.tab] = fromHash();
state.tab = state.tab || "overview";
poll(true);
setInterval(() => poll(false), 3000);
</script>
