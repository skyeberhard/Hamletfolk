name: Hamletfolk
version: '${version}'
main: io.github.skyeberhard.hamletfolk.paper.HamletfolkPlugin
api-version: '26.2'
description: Gives villagers persistent identities, and gives villages an economy and a written history.
author: skyeberhard
commands:
  settlement:
    description: Information about the nearest settlement.
    usage: /settlement [info|history|residents|buildings|beds|plan|lots [on|off]|projects|survey|donate [amount|all]|admin]
    aliases: [village]
    permission: hamletfolk.use
permissions:
  hamletfolk.use:
    description: Use /settlement and talk to residents.
    default: true
  hamletfolk.ignore:
    description: Place an [Exempt] sign, which leaves the villagers around it that are not part of a village alone.
    default: true
  hamletfolk.ignore.village:
    description: An [Exempt] sign that also leaves alone villagers who already belong to a village.
    default: op
  hamletfolk.admin:
    description: Use /settlement admin (list, inspect, rename, save, ignore, capture, build), including from the console.
    default: op
