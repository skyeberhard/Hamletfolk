name: MCSocieties
version: '${version}'
main: io.github.skyeberhard.societies.paper.SocietiesPlugin
api-version: '1.21'
description: Gives villagers persistent identities, and gives villages an economy and a written history.
author: skyeberhard
commands:
  settlement:
    description: Information about the nearest settlement.
    usage: /settlement [info|history|residents|donate]
    aliases: [village]
    permission: mcsocieties.use
permissions:
  mcsocieties.use:
    description: Use /settlement and talk to residents.
    default: true
