name: Hamletfolk
version: '${version}'
main: io.github.skyeberhard.hamletfolk.paper.HamletfolkPlugin
api-version: '26.2'
description: Gives villagers persistent identities, and gives villages an economy and a written history.
author: skyeberhard
commands:
  settlement:
    description: Information about the nearest settlement.
    usage: /settlement [info|history|residents|buildings|beds|donate [amount|all]|admin]
    aliases: [village]
    permission: hamletfolk.use
permissions:
  hamletfolk.use:
    description: Use /settlement and talk to residents.
    default: true
  hamletfolk.admin:
    description: Use /settlement admin (list, inspect, rename, save), including from the console.
    default: op
